mode = "light"

# last-round-overcast2
# Deutan-friendly on a light background: red is a crimson (reads bluish to
# deutan eyes) and yellow an olive gold, so they never collapse into the same
# brown; errors vs additions stay crimson vs teal. All syntax colors >= 4.5:1.
accent = "#b8480e"
selection = "#bccadf"
muted = "#666d76"

background = "#e0e3e7"
dark_background = "#d5d9de"
darker_background = "#c9ced5"
lighter_background = "#eceef1"

foreground = "#1e2228"
dark_foreground = "#474e58"
light_foreground = "#2c3139"
bright_foreground = "#0b0d10"

red = "#b8214a"
yellow = "#5f5400"
orange = "#b8480e"
green = "#0b6e58"
cyan = "#08697f"
blue = "#2458b8"
magenta = "#8a3a96"
brown = "#7a5433"

bright_red = "#d0305c"
bright_yellow = "#766a00"
bright_green = "#128a6e"
bright_cyan = "#0a7f99"
bright_blue = "#3a6fd0"
bright_magenta = "#a04cad"

hyprland_active_border = "rgba(b8480eee) rgba(7a543388) 90deg"
